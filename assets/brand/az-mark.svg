<svg width="240" height="70" viewBox="0 0 240 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="azRedPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333E"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#9B020A"/>
    </linearGradient>
    <linearGradient id="azRedSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF525C"/>
      <stop offset="60%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#7A0006"/>
    </linearGradient>
    <linearGradient id="azBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="azSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="azGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(6, 7)">
    <!-- Ambient Glow behind Emblem -->
    <path d="M22 6 L44 48 L32 48 L22 28 L12 48 L0 48 Z" fill="#E50914" opacity="0.3" filter="url(#azGlow)"/>
    <path d="M28 8 L54 8 L24 48 L56 48 L54 55 L16 55 L42 16 L28 16 Z" fill="#E50914" opacity="0.25" filter="url(#azGlow)"/>

    <!-- Geometric AZ Monogram -->
    <!-- Left Stems of A -->
    <path d="M22 6 L32 26 L24 26 L18 14 L8 34 L16 34 L21 44 L0 44 L17 10 L22 6 Z" fill="url(#azRedPrimary)"/>
    
    <!-- Dynamic A/Z Bridge & Sharp Spine -->
    <path d="M22 6 L48 6 L20 48 L54 48 L52 56 L12 56 L38 16 L22 16 Z" fill="url(#azRedSecondary)"/>

    <!-- Sharp Interlocking Blade (A Apex to Z Cross) -->
    <path d="M22 6 L34 26 L46 26 L30 6 Z" fill="url(#azRedPrimary)"/>
    <path d="M14 36 L40 36 L36 42 L11 42 Z" fill="#FF4752" opacity="0.9"/>

    <!-- Cyber Core Accent Node -->
    <circle cx="53" cy="11" r="2.5" fill="#FFFFFF"/>
    <circle cx="53" cy="11" r="5" fill="#E50914" opacity="0.6" filter="url(#azGlow)"/>

    <!-- Typography: ABDULLAH ZAFAR -->
    <!-- ABDULLAH -->
    <text x="68" y="27" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3.5" fill="url(#azSilver)">
      ABDULLAH
    </text>
    
    <!-- Subtitle Bar & ZAFAR -->
    <text x="69" y="44" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="6.5" fill="#E50914">
      ZAFAR
    </text>

    <!-- Engineering/Cinematic Metadata Pill -->
    <rect x="162" y="34" width="46" height="13" rx="2.5" fill="#141722" stroke="#334155" stroke-width="0.8"/>
    <text x="167" y="43.5" font-family="'Inter', monospace" font-weight="700" font-size="7" letter-spacing="1" fill="#10B981">
      AI · 2026
    </text>
  </g>
</svg>
